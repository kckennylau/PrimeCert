name: Polya memory experiment

on:
  workflow_dispatch:
  push:
    branches: [polya-mem]

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        mode: [default, sync]
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: build the polya command
        run: lake build PrimeCert.Meta.Polya
      - name: run at the worst cutoff, sampling memory
        run: |
          mkdir -p bench
          if [ "${{ matrix.mode }}" = "sync" ]; then
            printf 'import PrimeCert.Meta.Polya\nset_option maxRecDepth 4000000\nset_option Elab.async false\nopen PrimeCert.Polya\nrun_polya 906150257 200000\n' > bench/Mem.lean
          else
            printf 'import PrimeCert.Meta.Polya\nset_option maxRecDepth 4000000\nopen PrimeCert.Polya\nrun_polya 906150257 200000\n' > bench/Mem.lean
          fi
          ( while true; do
              tot=$(ps -eo rss=,comm= | awk '$2 ~ /lean|lake/ {s+=$1} END {print s+0}')
              echo "$(date +%s),$tot" >> bench/rss.csv
              sleep 2
            done ) &
          sampler=$!
          ex=0
          /usr/bin/time -f "%e %M" -o bench/t.txt lake env lean bench/Mem.lean > bench/out.log 2>&1 || ex=$?
          kill $sampler 2>/dev/null || true
          read -r secs rss < bench/t.txt
          echo "mode,seconds,time_peak_rss_kb,sampled_peak_kb,exit,value"
          peak=$(awk -F, 'BEGIN{m=0} {if ($2>m) m=$2} END {print m}' bench/rss.csv)
          val=$(grep -ho "L(906150257) = -\?[0-9]*" bench/out.log | head -1)
          echo "${{ matrix.mode }},$secs,$rss,$peak,$ex,$val"
          echo "--- memory over time, every 20th sample, seconds since start and kb ---"
          awk -F, 'NR==1{t0=$1} NR%10==1 {printf "%d,%d\n", $1-t0, $2}' bench/rss.csv
          if [ "$ex" -ne 0 ]; then tail -5 bench/out.log; fi

name: Polya at the target, checked against unchecked

on:
  push:
    branches:
      - 'ci/polya-cert-ab'

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build the library
        run: lake build PrimeCert.Meta.Polya

      - name: Alternate the two arms, three rounds
        run: |
          set -u
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          for round in 1 2 3; do
            for arm in PolyaCertFull PolyaFullUnchecked; do
              /usr/bin/time -v lean "PrimeCertTest/$arm.lean" \
                > "out-$arm-$round.txt" 2> "time-$arm-$round.txt" || echo "FAILED $arm round $round"
              wall=$(grep 'Elapsed (wall clock)' "time-$arm-$round.txt" | awk '{print $8}')
              peak=$(grep 'Maximum resident set size' "time-$arm-$round.txt" | awk '{print $6}')
              echo "round $round | $arm | wall $wall | peak ${peak} KB | $(cat out-$arm-$round.txt)"
            done
          done

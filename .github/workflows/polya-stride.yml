name: Time the run at the counterexample

on:
  push:
    branches:
      - 'ci/polya-stride*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  polya:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Polya"
          test: false
          lint: false
      - name: Time the run
        run: |
          for round in 1 2; do
            start=$(date +%s%N)
            lake env lean -Dtrace.profiler=true -Dtrace.profiler.threshold=1 \
              PrimeCertTest/PolyaFull.lean > out.$round.txt 2>&1 || true
            end=$(date +%s%N)
            wall=$(( (end - start) / 1000000 ))
            echo "SAMPLE round $round"
            grep '\[Kernel\]' out.$round.txt | head -3 | cat -A | cut -c1-160
            kernel=$(grep '\[Kernel\]' out.$round.txt \
              | sed -E 's/.*[^0-9.]([0-9]+(\.[0-9]+)?)(ms|s)\b.*/\1 \3/' \
              | awk 'NF == 2 { if ($2 == "ms") s += $1 / 1000; else s += $1 }
                     END { printf "%.3f", s }')
            echo "ROUND $round wall_ms=$wall kernel_s=$kernel"
            grep -c '\[Kernel\]' out.$round.txt | sed 's/^/kernel_lines=/'
            grep -E 'L\(906150257\)' out.$round.txt | head -2
          done

name: Time the run at the counterexample

on:
  push:
    branches:
      - 'ci/polya-stride-ab'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  polya:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build-args: "Polya"
          test: false
          lint: false
      - name: Alternate the two strides in one job
        run: |
          for round in 1 2 3; do
            for arm in 32 64; do
              git checkout origin/ci/polya-stride$arm -- PrimeCert Polya
              lake build Polya > build.log 2>&1 || { tail -5 build.log; exit 1; }
              start=$(date +%s%N)
              lake env lean -Dtrace.profiler=true -Dtrace.profiler.threshold=1 \
                PrimeCertTest/PolyaFull.lean > out.txt 2>&1 || true
              end=$(date +%s%N)
              wall=$(( (end - start) / 1000000 ))
              kernel=$(grep '\[Kernel\]' out.txt \
                | sed -E 's/.*\[Kernel\] \[([0-9]+\.[0-9]+)\].*/\1/' \
                | awk '/^[0-9]/ { s += $1 } END { printf "%.3f", s }')
              lines=$(grep -c '\[Kernel\]' out.txt || true)
              value=$(grep -o 'L(906150257) = [-0-9]*' out.txt | head -1)
              echo "ARM $arm ROUND $round wall_ms=$wall kernel_s=$kernel lines=$lines $value"
            done
          done

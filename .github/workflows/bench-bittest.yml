name: Bench the loop's bit test

on:
  push:
    branches:
      - 'bench-bittest'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      - name: Time both spellings on the 1e8 verification, interleaved
        run: |
          FILE=PrimeCertTest/SieveVerify1e8.lean
          for i in 1 2 3; do
            git checkout -- PrimeCert/Sieve.lean PrimeCert/SieveCorrect.lean
            lake build PrimeCert.SieveCorrect
            /usr/bin/time -f "A$i (1 <<= b &&& 1<<<j) wall %e s peak %M KB" lake env lean "$FILE"
            git apply bittest.patch
            lake build PrimeCert.SieveCorrect
            /usr/bin/time -f "B$i (testBitK b j == 1)  wall %e s peak %M KB" lake env lean "$FILE"
          done
          git checkout -- PrimeCert/Sieve.lean PrimeCert/SieveCorrect.lean

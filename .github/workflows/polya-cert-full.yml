name: Polya at the target, prime powers checked

on:
  push:
    branches:
      - 'ci/polya-cert-full'

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the mathlib build cache
        run: lake exe cache get

      - name: Build the library
        run: lake build PrimeCert.Meta.Polya

      - name: Run the target
        run: |
          set -u
          export LEAN_PATH=$(lake env printenv LEAN_PATH)
          /usr/bin/time -v lean PrimeCertTest/PolyaCertFull.lean > out.txt 2> time.txt || echo FAILED
          cat out.txt
          grep 'Elapsed (wall clock)' time.txt
          grep 'Maximum resident set size' time.txt

name: Polya pair bench

on:
  workflow_dispatch:
  push:
    branches: [polya-pairbench]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: five interleaved rounds at the full target
        run: |
          mkdir -p bench
          printf 'import PrimeCert.Meta.Polya\nset_option maxRecDepth 4000000\nset_option Elab.async false\nopen PrimeCert.Polya\nrun_polya 906150257 1000000\n' \
            > /tmp/Bench.lean
          echo "round,variant,seconds,peak_rss_kb,exit,answer"
          for round in 1 2 3 4 5; do
            for b in polya opt2-landfirst opt4-maskfuel opt24-combined; do
              git checkout -q -f "origin/$b" 2>/dev/null || { echo "$round,$b,,,checkout-failed,"; continue; }
              cp /tmp/Bench.lean PrimeCertTest/Bench.lean
              lake build PrimeCert.Meta.Polya > bench/build.log 2>&1 || { echo "$round,$b,,,build-failed,"; continue; }
              ex=0
              /usr/bin/time -f "%e %M" -o bench/t.txt lake env lean PrimeCertTest/Bench.lean \
                > bench/out.log 2>&1 || ex=$?
              read -r secs rss < bench/t.txt
              ans=$(grep -ho "L(906150257) = -\?[0-9]*" bench/out.log | head -1)
              echo "$round,$b,$secs,$rss,$ex,$ans"
              rm -f PrimeCertTest/Bench.lean
            done
          done
